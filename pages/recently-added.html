<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="recentlyAddedTitle">Sách Mới Thêm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/assets/css/profile.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">

    <style>
        /* Tối ưu hóa Style cho Dark Mode (Giữ nguyên) */
        body.dark-theme .form-control,
        body.dark-theme .form-select {
            background-color: #333;
            color: #fff;
            border-color: #555;
        }

        body.dark-theme .filter-box {
            background-color: #222;
            border-color: #333;
        }

        body.dark-theme .text-dark {
            color: #fff !important;
        }

        body.dark-theme .btn-outline-dark {
            color: #ccc;
            border-color: #555;
        }

        body.dark-theme .btn-outline-dark:hover {
            background-color: #444;
            color: #fff;
        }

        /* Cấu trúc Layout */
        .search-container {
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* KHẮC PHỤC LỖI TOPBAR ĐÈ & LUI TRANG XUỐNG THÊM */
        .search-header {
            /* Giảm padding so với trang Tìm kiếm Nâng cao */
            padding-top: 65px;
            margin-top: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        body.dark-theme .search-header {
            background-color: #1a1a1a;
        }

        .pagination-footer {
            margin-top: 40px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
        }

        body.dark-theme .book-card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3) !important;
        }

        /* CSS cho chế độ xem dạng Danh sách (List View) - Tái sử dụng */
        .book-view-list {
            --bs-gutter-x: 0;
            --bs-gutter-y: 0;
            display: block;
        }

        .book-view-list>.col {
            width: 100%;
            margin-bottom: 15px;
            padding-left: 0;
            padding-right: 0;
        }

        .book-view-list .card {
            flex-direction: row;
            height: 120px !important;
            align-items: center;
            padding: 10px;
            background-color: var(--card-bg-light);
        }

        .book-view-list .card-body {
            padding: 0 15px !important;
            flex-grow: 1;
            overflow: hidden;
        }

        .book-view-list .position-relative {
            padding-top: 0 !important;
            width: 70px;
            height: 100%;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
        }

        .book-view-list .card-title,
        .book-view-list .text-muted.mb-2 {
            margin-bottom: 5px !important;
        }

        .book-view-list .mt-auto {
            margin-top: 5px !important;
        }
    </style>
</head>

<body class="hero-page">

    <div id="topbar-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div class="search-header">
            <div class="search-container">
                <h4 class="mb-0 fw-bold" data-lang-key="recentlyAddedTitle">Sách Mới Thêm</h4>
            </div>
        </div>

        <div class="search-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold" data-lang-key="latestBooksTitle">Danh sách Sách mới</h5>
                <div class="view-toggle-buttons btn-group btn-group-sm" role="group">
                    <button type="button" class="btn btn-outline-dark active" id="gridViewBtn" data-view="grid"
                        title="Dạng Lưới">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button type="button" class="btn btn-outline-dark" id="listViewBtn" data-view="list"
                        title="Dạng Danh sách">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <div id="results-container-recent" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3">
            </div>

            <div class="pagination-footer" id="pagination-footer-recent">
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app-ui.js" defer></script>
    <script type="module" src="/js/recently-added.js"></script>
</body>

</html>
