<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="randomTitle">Ngẫu nhiên</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/assets/css/profile.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link rel="stylesheet" href="/assets/css/random.css">

    <style>
        /* Tối ưu hóa Style cho Dark Mode & Cấu trúc Layout (Copy từ advance-search) */
        
        /* === QUY TẮC BẠN ĐÃ CÓ === */
        body.dark-theme .form-control,
        body.dark-theme .form-select {
            background-color: #333;
            color: #fff;
            border-color: #555;
        }

        body.dark-theme .input-group-text {
            background-color: #333 !important;
            border-color: #555 !important;
            color: #ccc;
        }

        body.dark-theme .filter-box {
            background-color: #222;
            border-color: #333;
        }

        body.dark-theme .search-header {
            background-color: #1a1a1a;
            border-color: #333;
        }

        /* === KHẮC PHỤC LỖI MẤT CHỮ VÀ ICON TRÊN NỀN DARK === */
        
        /* 1. Đảm bảo chữ, tiêu đề, và nội dung mặc định là màu sáng */
        body.dark-theme,
        body.dark-theme h1,
        body.dark-theme h2,
        body.dark-theme h3,
        body.dark-theme h4,
        body.dark-theme h5,
        body.dark-theme h6,
        body.dark-theme p,
        body.dark-theme span,
        body.dark-theme label,
        body.dark-theme a:not(.btn) {
            color: #ccc; /* Màu chữ tổng thể */
        }
        
        /* 2. Sửa lỗi text-muted (màu chữ phụ) bị ẩn trên nền tối */
        body.dark-theme .text-muted {
            color: #999 !important;
        }
        
        /* 3. Đảm bảo class .text-dark (thường là màu đen) chuyển thành màu trắng */
        body.dark-theme .text-dark {
            color: #fff !important;
        }

        /* 4. Sửa lỗi icon và nút */
        body.dark-theme .input-group-text i {
            color: #fff; /* Đảm bảo icon trong ô input là màu trắng */
        }

        body.dark-theme .btn-primary {
            background-color: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
            color: #fff !important;
        }
        
        /* 5. Sửa lỗi nút Outline Dark (dùng cho chế độ xem Grid/List) */
        body.dark-theme .btn-outline-dark {
            color: #ccc;
            border-color: #555;
        }

        body.dark-theme .btn-outline-dark:hover {
            background-color: #444;
            color: #fff;
        }
        
        /* 6. Đảm bảo thẻ <option> trong dropdown hiển thị đúng trên nền tối */
        body.dark-theme option {
            background-color: #333;
            color: #ccc;
        }
        /* === KẾT THÚC KHẮC PHỤC LỖI === */

        /* Cấu trúc Layout (Giữ nguyên) */
        .search-container {
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* KHẮC PHỤC LỖI TOPBAR ĐÈ & LUI TRANG XUỐNG THÊM (Giữ nguyên) */
        .search-header {
            padding-top: 65px;
            margin-top: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        /* CSS cho chế độ xem dạng Danh sách (List View) - Copy từ advance-search */
        .book-view-list {
            /* Vô hiệu hóa g-3 và các thuộc tính cột của row-cols-x */
            --bs-gutter-x: 0;
            --bs-gutter-y: 0;
            display: block;
        }

        .book-view-list>.col {
            width: 100%;
            margin-bottom: 15px;
            padding-left: 0;
            padding-right: 0;
        }

        body.dark-theme .book-view-list .card {
            background-color: #222; /* Màu nền Card List View trong Dark Mode */
        }
        
        .book-view-list .card {
            flex-direction: row;
            height: 120px !important;
            align-items: center;
            padding: 10px;
            background-color: var(--card-bg-light);
        }

        .book-view-list .card-body {
            padding: 0 15px !important;
            flex-grow: 1;
            overflow: hidden;
        }

        .book-view-list .position-relative {
            padding-top: 0 !important;
            width: 70px;
            height: 100%;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
        }

        .book-view-list .card-title,
        .book-view-list .text-muted.mb-2 {
            margin-bottom: 5px !important;
        }

        .book-view-list .mt-auto {
            margin-top: 5px !important;
        }

        .pagination-footer {
            margin-top: 40px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>

<body class="hero-page">

    <div id="topbar-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div class="search-header">
            <div class="search-container d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0 fw-bold" data-lang-key="randomTitle">Sách Ngẫu nhiên</h4>
            </div>

            <div class="search-container">
                <div class="input-group mb-3">
                    <span class="input-group-text bg-transparent border-end-0 border-dark" data-lang-key="selectQtyLabel">
                        <i class="fas fa-shuffle me-2"></i>Chọn số lượng sách
                    </span>
                    <select class="form-select border-start-0 border-dark bg-transparent" id="random-count-select">
                        <option value="1" selected data-lang-key="bookCount1">1 cuốn sách</option>
                        <option value="5" data-lang-key="bookCount5">5 cuốn sách</option>
                        <option value="10" data-lang-key="bookCount10">10 cuốn sách</option>
                        <option value="20" data-lang-key="bookCount20">20 cuốn sách</option>
                    </select>
                </div>

                <div class="text-end mb-4">
                    <button class="btn btn-primary btn-sm rounded-pill" id="fetchRandomBooksBtn" data-lang-key="fetchRandomBtn">
                        <i class="fas fa-dice me-1"></i> Tìm sách Ngẫu nhiên
                    </button>
                </div>
            </div>
        </div>

        <div class="search-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold" data-lang-key="resultsTitleRandom">Kết quả Ngẫu nhiên</h5>
                <div class="view-toggle-buttons btn-group btn-group-sm" role="group">
                    <button type="button" class="btn btn-outline-dark active" id="gridViewBtn" data-view="grid"
                        data-lang-key-title="gridViewTitle" title="Dạng Lưới">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button type="button" class="btn btn-outline-dark" id="listViewBtn" data-view="list"
                        data-lang-key-title="listViewTitle" title="Dạng Danh sách">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <div id="results-container-random" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3">
                <div id="initial-hint" class="col-12 text-center text-muted p-5">
                    <i class="fas fa-hand-point-up fa-2x mb-3"></i>
                    <p class="lead" data-lang-key="randomInitialHint">Chọn số lượng sách và nhấn **"Tìm sách Ngẫu nhiên"** để bắt đầu khám phá!</p>
                </div>
            </div>

            <div class="pagination-footer">
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app-ui.js" defer></script>
    <script type="module" src="/js/random.js"></script>
</body>

</html>
