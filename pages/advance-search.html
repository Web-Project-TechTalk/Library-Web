<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="advSearchTitle">Tìm kiếm Nâng cao</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/assets/css/profile.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">

    <style>
        /* Tối ưu hóa Style cho Dark Mode (Giữ nguyên) */
        body.dark-theme .form-control,
        body.dark-theme .form-select {
            background-color: #333;
            color: #fff;
            border-color: #555;
        }

        body.dark-theme .input-group-text {
            background-color: #333 !important;
            border-color: #555 !important;
            color: #ccc;
        }

        body.dark-theme .filter-box {
            background-color: #222;
            border-color: #333;
        }

        body.dark-theme .search-header {
            background-color: #1a1a1a;
            border-color: #333;
        }

        body.dark-theme .text-dark {
            color: #fff !important;
        }

        body.dark-theme .btn-outline-dark {
            color: #ccc;
            border-color: #555;
        }

        body.dark-theme .btn-outline-dark:hover {
            background-color: #444;
            color: #fff;
        }

        /* Cấu trúc Layout */
        .search-container {
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* KHẮC PHỤC LỖI TOPBAR ĐÈ & LUI TRANG XUỐNG THÊM */
        .search-header {
            padding-top: 65px;
            margin-top: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        body.dark-theme .search-header {
            background-color: #1a1a1a;
        }

        /* Bộ lọc */
        .filter-box {
            position: relative;
            padding: 20px;
            border-radius: 8px;
            background-color: var(--card-bg);
            transition: all 0.3s ease-in-out;
            overflow: hidden;
            height: auto;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
        }

        .filter-box.show {
            max-height: 500px;
            padding-top: 20px;
            padding-bottom: 20px;
            opacity: 1;
        }

        /* Ẩn overlay */
        #filterHintOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            border-radius: 8px;
            text-align: center;
            transition: opacity 0.3s ease-in-out;
            opacity: 1;
            z-index: 1;
        }

        .filter-box.show #filterHintOverlay {
            opacity: 0;
            pointer-events: none;
        }

        .pagination-footer {
            margin-top: 40px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
        }

        body.dark-theme .book-card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3) !important;
        }

        /* CSS cho chế độ xem dạng Danh sách (List View) */
        .book-view-list {
            /* Vô hiệu hóa g-3 và các thuộc tính cột của row-cols-x */
            --bs-gutter-x: 0;
            --bs-gutter-y: 0;
            display: block;
            /* Đảm bảo nó không còn là grid/flex */
        }

        .book-view-list>.col {
            width: 100%;
            margin-bottom: 15px;
            /* Khoảng cách giữa các hàng */
            padding-left: 0;
            padding-right: 0;
        }

        .book-view-list .card {
            flex-direction: row;
            /* Chuyển card thành hàng ngang */
            height: 120px !important;
            /* Chiều cao cố định cho hàng */
            align-items: center;
            padding: 10px;
            background-color: var(--card-bg-light);
            /* Màu nền khác biệt */
        }

        .book-view-list .card-body {
            padding: 0 15px !important;
            flex-grow: 1;
            overflow: hidden;
        }

        .book-view-list .position-relative {
            padding-top: 0 !important;
            /* Vô hiệu hóa tỉ lệ 150% */
            width: 70px;
            /* Chiều rộng bìa sách */
            height: 100%;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
        }

        .book-view-list .card-title,
        .book-view-list .text-muted.mb-2 {
            margin-bottom: 5px !important;
        }

        /* Hiển thị Rating/View count ở list view */
        .book-view-list .mt-auto {
            margin-top: 5px !important;
        }
    </style>

    <script>
        // Logic ẩn/hiện bộ lọc (Giữ nguyên)
        document.addEventListener('DOMContentLoaded', () => {
            const filterBox = document.getElementById('filterBox');
            const toggleButton = document.getElementById('toggleFiltersBtn');
            const overlay = document.getElementById('filterHintOverlay');

            const hideText = toggleButton.getAttribute('data-hide-text');
            const showText = toggleButton.getAttribute('data-show-text');

            toggleButton.addEventListener('click', () => {
                const isHidden = !filterBox.classList.contains('show');

                if (isHidden) {
                    filterBox.classList.add('show');
                    toggleButton.textContent = hideText;
                    overlay.style.opacity = '0';
                    overlay.style.pointerEvents = 'none';
                } else {
                    filterBox.classList.remove('show');
                    toggleButton.textContent = showText;
                    overlay.style.opacity = '1';
                    overlay.style.pointerEvents = 'auto';
                }
            });

            // Khởi tạo ban đầu (Ẩn)
            filterBox.classList.remove('show');
            toggleButton.textContent = showText;
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
        });
    </script>
</head>

<body class="hero-page">

    <div id="topbar-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div class="search-header">
            <div class="search-container d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0 fw-bold" data-lang-key="advSearchTitle">Tìm kiếm Nâng cao</h4>
            </div>

            <div class="search-container">
                <div class="input-group mb-3">
                    <span class="input-group-text bg-transparent border-end-0 border-dark" data-lang-key="searchLabel">
                        <i class="fas fa-search me-2"></i>Tìm kiếm
                    </span>
                    <input type="text" class="form-control border-start-0 border-dark bg-transparent"
                        id="search-input-adv" placeholder="Nhập tên sách, tác giả...">
                </div>

                <div class="text-end mb-4">
                    <button class="btn btn-outline-dark btn-sm rounded-pill" id="toggleFiltersBtn"
                        data-show-text="Hiện bộ lọc" data-hide-text="Ẩn bộ lọc" data-lang-key="showFilters">Hiện bộ
                        lọc</button>
                </div>
            </div>
        </div>

        <div class="search-container">
            <div class="filter-box shadow-sm mb-4" id="filterBox">
                <div class="row g-3">

                    <div class="col-md-6 col-lg-3">
                        <select class="form-select" id="search-field-select-adv">
                            <option value="all" selected data-lang-key="searchFieldAll">Tìm kiếm: Tên sách & Tác giả
                            </option>
                            <option value="title" data-lang-key="searchFieldTitle">Tìm kiếm: Tên sách (Title)</option>
                            <option value="author_name" data-lang-key="searchFieldAuthor">Tìm kiếm: Tên tác giả (Author)
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6 col-lg-3">
                        <select class="form-select" id="sort-select-adv">
                            <option value="" disabled selected data-lang-key="sortPlaceholder">Sắp xếp theo...</option>
                            <option value="date" data-lang-key="sortByDate">Ngày thêm (Mới nhất)</option>
                            <option value="views" data-lang-key="sortByViews">Lượt xem (Nhiều nhất)</option>
                            <option value="rating" data-lang-key="sortByRating">Đánh giá (Cao nhất)</option>
                            <option value="title_asc" data-lang-key="sortByTitleAsc">Tên sách (A-Z)</option>
                        </select>
                    </div>

                </div>

                <div id="filterHintOverlay">
                    <p class="mb-2 text-muted" data-lang-key="filterHint">
                        Ấn **"Hiện bộ lọc"** để chọn các tùy chọn lọc và sắp xếp.
                    </p>
                    <small class="text-muted" data-lang-key="filterHintSmall">Trường tìm kiếm, Sắp xếp theo.</small>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold" data-lang-key="resultsTitle">Kết quả Tìm kiếm Sách</h5>
                <div class="view-toggle-buttons btn-group btn-group-sm" role="group">
                    <button type="button" class="btn btn-outline-dark active" id="gridViewBtn" data-view="grid"
                        title="Dạng Lưới">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button type="button" class="btn btn-outline-dark" id="listViewBtn" data-view="list"
                        title="Dạng Danh sách">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <div id="results-container-adv" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3">
            </div>

            <div class="pagination-footer">
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app-ui.js" defer></script>
    <script type="module" src="/js/advance-search.js"></script>
</body>

</html>
