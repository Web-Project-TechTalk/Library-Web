<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Thư Viện Số</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/assets/css/profile.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>

<body class="hero-page">

    <div id="topbar-placeholder"></div>

    <div id="sidebar-placeholder"></div>

    <div class="main-content">

        <div class="popular-new-titles-section position-relative">
            <h4 class="pnt-main-title">Đầu sách Phổ biến</h4>

            <div class="pnt-controls">
                <button class="btn pnt-control-btn" type="button" data-bs-target="#popularNewTitlesCarousel"
                    data-bs-slide="prev">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="btn pnt-control-btn" type="button" data-bs-target="#popularNewTitlesCarousel"
                    data-bs-slide="next">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <div id="popularNewTitlesCarousel" class="carousel slide" data-bs-ride="false">
                <div class="carousel-inner">
                    </div>
            </div>
        </div>

        <div class="container-fluid py-4 px-lg-5">
            <div class="row g-4">
                
                <div class="col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0 fw-bold border-start border-4 border-primary ps-3">Sách Mới Cập Nhật</h4>
                        <a href="../pages/all-books.html" class="btn btn-sm btn-outline-primary rounded-pill">Xem tất cả</a>
                    </div>
                    
                    <div id="new-books-row" class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3">
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary"></div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3">          
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body" id="most-viewed-list">
                            <h5 class="card-title fw-bold mb-3">Xem nhiều nhất</h5>
                            <div class="text-center"><div class="spinner-border spinner-border-sm"></div></div>
                        </div>
                    </div>

                    <div class="card shadow-sm border-0">
                        <div class="card-body" id="popular-categories-list">
                            <h5 class="card-title fw-bold mb-3">Thể loại phổ biến</h5>
                            <div class="text-center"><div class="spinner-border spinner-border-sm"></div></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app-ui.js" defer></script>
    
    <script type="module" src="/js/dashboard-main.js"></script>

</body>

</html>
